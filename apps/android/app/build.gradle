plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

tasks.register('buildLocalUi', Exec) {
    workingDir rootProject.projectDir.parentFile.parentFile
    commandLine 'node', 'upstream/memos/web/node_modules/vite/bin/vite.js', 'build', '--config', 'apps/android/local-ui/vite.config.mts'
    inputs.dir '../local-ui'
    inputs.dir '../../../upstream/memos/web/src'
    inputs.file '../../../upstream/memos/web/pnpm-lock.yaml'
    outputs.dir "$buildDir/generated/assets/local-ui"
}
tasks.named('preBuild').configure { dependsOn 'buildLocalUi' }
def localUiDigest = java.security.MessageDigest.getInstance('SHA-256')
def localUiInputs = fileTree('../local-ui') { include '**/*.ts', '**/*.tsx', '**/*.mts', '**/*.css', 'index.html', 'package-lock.json'; exclude 'node_modules/**' }.files +
    fileTree('../../../upstream/memos/web/src').files + fileTree('../../../upstream/memos/web/public').files
localUiInputs.sort { it.absolutePath }.each { source -> localUiDigest.update(source.absolutePath.bytes); localUiDigest.update(source.bytes) }
def localUiStage = "$buildDir/packaged-local-ui/${localUiDigest.digest().encodeHex()}"
tasks.register('stageLocalUi', Copy) {
    dependsOn 'buildLocalUi'
    from "$buildDir/generated/assets/local-ui"
    into "$localUiStage/local-ui"
    include { entry ->
        def manifest = new groovy.json.JsonSlurper().parse(file("$buildDir/current-local-ui-assets.json"))
        entry.directory || manifest.contains(entry.relativePath.pathString)
    }
}
tasks.named('preBuild').configure { dependsOn 'stageLocalUi' }

android {
    namespace 'xyz.leedaud.echo'
    compileSdk 36
    buildToolsVersion '35.0.0'
    buildFeatures { buildConfig true; compose true }

    defaultConfig {
        applicationId 'xyz.leedaud.echo'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.4.0-preview2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions { annotationProcessorOptions { arguments = ['room.schemaLocation': "$projectDir/schemas"] } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true; buildConfigField 'boolean', 'LOCAL_UI_DEFAULT', 'false' }
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            resValue 'string', 'app_name', 'Echo QA'
            matchingFallbacks = ['debug']
            buildConfigField 'boolean', 'LOCAL_UI_DEFAULT', 'false'
        }
        release { minifyEnabled false; buildConfigField 'boolean', 'LOCAL_UI_DEFAULT', 'false' }
    }
    testBuildType 'qa'
    lint { abortOnError true }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.includeAndroidResources = true }
    sourceSets {
        main.assets.srcDir localUiStage
        main.java.exclude '**/MainActivity.java', '**/NavigationPolicy.java'
        test.java.exclude '**/NavigationPolicyTest.java'
        androidTest.java.exclude '**/AndroidSmokeInstrumentation.java'
    }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation platform('androidx.compose:compose-bom:2025.06.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'xyz.leedaud.echo'
    compileSdk 36
    buildToolsVersion '35.0.0'
    buildFeatures { buildConfig true; compose true }

    defaultConfig {
        applicationId 'xyz.leedaud.echo'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions { annotationProcessorOptions { arguments = ['room.schemaLocation': "$projectDir/schemas"] } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true }
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            resValue 'string', 'app_name', 'Echo QA'
            matchingFallbacks = ['debug']
        }
        release { minifyEnabled false }
    }
    testBuildType 'qa'
    lint { abortOnError true }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.includeAndroidResources = true }
    sourceSets {
        main.java.exclude '**/MainActivity.java', '**/NavigationPolicy.java'
        test.java.exclude '**/NavigationPolicyTest.java'
        androidTest.java.exclude '**/AndroidSmokeInstrumentation.java'
    }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation platform('androidx.compose:compose-bom:2025.06.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
